[project]
name = "recap"
version = "0.1.0"
description = "RecapStudio worker: AI movie recap pipeline (local)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mlx-whisper>=0.4",
    "scenedetect[opencv]>=0.6.4",
    "edge-tts>=6.1",
    "ollama>=0.3",
    "pillow>=10.0",
    "numpy>=1.26",
    "vieneu>=3.8,<4",
    # Pinned: onnxruntime >=1.23 rejects VieNeu's external weights because the HF cache stores them as symlinks.
    "onnxruntime==1.22.1",
    "pyobjc-framework-vision>=10",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs ffmpeg/ffprobe on PATH"]

[tool.coverage.run]
source = ["recap"]
patch = ["subprocess"]  # measure `python -m recap` subprocesses started by the CLI tests
parallel = true
sigterm = true
